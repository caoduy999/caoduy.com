<!DOCTYPE html>
<html lang="de" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery - caoduy.com</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <style type="text/tailwindcss">
    body {
      min-height: 100vh;
      transition: background 0.3s, color 0.3s;
    }
    .dark body {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    }

    /* Light mode toggle track */
    .toggle-track {
      width: 48px; height: 26px;
      border-radius: 9999px;
      position: relative;
      cursor: pointer;
      transition: background 0.3s;
    }
    .toggle-thumb {
      position: absolute;
      top: 3px; left: 3px;
      width: 20px; height: 20px;
      border-radius: 9999px;
      background: white;
      transition: transform 0.3s, background 0.3s;
      display: flex; align-items: center; justify-content: center;
    }
    html.dark .toggle-track  { background: #6366f1; }
    html:not(.dark) .toggle-track { background: #cbd5e1; }
    html.dark .toggle-thumb  { transform: translateX(22px); }
    html:not(.dark) .toggle-thumb { transform: translateX(0); }

    .footer-body {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.3s ease;
    }
    .footer-body.open { grid-template-rows: 1fr; }
    .footer-body > div { overflow: hidden; }
    .chevron { transition: transform 0.3s ease; }
    .chevron.open { transform: rotate(180deg); }

    .text-content {
      @apply text-slate-600 dark:text-slate-400 text-sm leading-relaxed text-justify;
    }
    .footer-label {
      @apply text-xs font-semibold text-slate-400 dark:text-slate-500 uppercase tracking-wider;
    }
    .footer-action {
      @apply flex items-center gap-2 text-sm text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-white transition-colors duration-200;
    }
    .tech-tag {
      @apply px-2 py-0.5 rounded-md bg-slate-200 dark:bg-slate-700 text-slate-600 dark:text-slate-300 text-xs font-medium;
    }
  </style>
</head>
<body class="dark:text-white text-slate-800 p-8 font-sans bg-slate-100">

  <!-- Header -->
  <div class="flex items-center justify-between max-w-6xl mx-auto mb-10">
    <div>
      <h1 class="text-4xl font-bold tracking-tight">AI &amp; Cloud Projects</h1>
      <p id="subtitle" class="dark:text-slate-400 text-slate-500 mt-1 text-lg">Eine Sammlung meiner Projekte</p>
    </div>

    <!-- Language + Theme controls -->
    <div class="flex items-center gap-4">

    <!-- Language Toggle -->
    <div class="flex items-center text-sm font-semibold dark:text-slate-400 text-slate-500">
      <button id="btn-de" onclick="switchLang('de')"
        class="px-2 py-0.5 rounded-l-md border dark:border-slate-600 border-slate-300 transition-colors duration-200">DE</button>
      <button id="btn-en" onclick="switchLang('en')"
        class="px-2 py-0.5 rounded-r-md border-t border-b border-r dark:border-slate-600 border-slate-300 transition-colors duration-200">EN</button>
    </div>

    <!-- Light/Dark Toggle -->
    <div class="flex items-center gap-2">
      <!-- Sun icon -->
      <svg class="w-4 h-4 dark:text-slate-500 text-amber-500" fill="currentColor" viewBox="0 0 24 24">
        <path d="M12 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm0 16a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zm10-6a1 1 0 010 2h-1a1 1 0 110-2h1zM3 12a1 1 0 010 2H2a1 1 0 110-2h1zm15.657-6.343a1 1 0 010 1.414l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 0zM6.464 17.536a1 1 0 010 1.414l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 0zM17.536 17.536a1 1 0 011.414 0l.707.707a1 1 0 01-1.414 1.414l-.707-.707a1 1 0 010-1.414zM5.05 6.464a1 1 0 011.414 0l.707.707A1 1 0 015.757 8.585l-.707-.707a1 1 0 010-1.414zM12 7a5 5 0 110 10A5 5 0 0112 7z"/>
      </svg>

      <div class="toggle-track" onclick="toggleTheme()">
        <div class="toggle-thumb">
          <!-- Moon icon (shown in dark mode) -->
          <svg class="w-3 h-3 text-indigo-600 hidden dark:block" fill="currentColor" viewBox="0 0 24 24">
            <path d="M21 12.79A9 9 0 1111.21 3a7 7 0 009.79 9.79z"/>
          </svg>
          <!-- Sun icon (shown in light mode) -->
          <svg class="w-3 h-3 text-amber-400 block dark:hidden" fill="currentColor" viewBox="0 0 24 24">
            <path d="M12 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm0 16a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zm10-6a1 1 0 010 2h-1a1 1 0 110-2h1zM3 12a1 1 0 010 2H2a1 1 0 110-2h1zm13.657-7.657a1 1 0 010 1.414l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 0zM12 7a5 5 0 110 10A5 5 0 0112 7z"/>
          </svg>
        </div>
      </div>

      <!-- Moon icon -->
      <svg class="w-4 h-4 dark:text-indigo-400 text-slate-400" fill="currentColor" viewBox="0 0 24 24">
        <path d="M21 12.79A9 9 0 1111.21 3a7 7 0 009.79 9.79z"/>
      </svg>
    </div>

    </div><!-- end controls -->
  </div>

  <!-- Gallery -->
  <div id="gallery" class="max-w-6xl mx-auto flex flex-wrap gap-6"></div>

  <p class="text-center dark:text-slate-600 text-slate-400 text-sm mt-16">caoduy.com</p>

  <script src="content.js"></script>
  <script>
    let currentLang = 'de';

    const i18n = {
      de: { subtitle: 'Eine Sammlung meiner Projekte', conclusion: 'Fazit' },
      en: { subtitle: 'A collection of things I built', conclusion: 'Summary' },
    };

    function switchLang(lang) {
      currentLang = lang;
      document.getElementById('subtitle').textContent = i18n[lang].subtitle;
      document.getElementById('btn-de').classList.toggle('dark:bg-slate-700', lang === 'de');
      document.getElementById('btn-de').classList.toggle('bg-slate-200', lang === 'de');
      document.getElementById('btn-en').classList.toggle('dark:bg-slate-700', lang === 'en');
      document.getElementById('btn-en').classList.toggle('bg-slate-200', lang === 'en');
      document.getElementById('gallery').innerHTML = projects.map(p => renderCard(p, lang)).join('');
    }

    function toggleTheme() {
      document.documentElement.classList.toggle('dark');
    }

    const accentClasses = {
      indigo: {
        shadow: "hover:shadow-indigo-500/20 hover:border-indigo-500/50",
        badge:  "bg-indigo-500/15 text-indigo-400",
      },
      emerald: {
        shadow: "hover:shadow-emerald-500/20 hover:border-emerald-500/50",
        badge:  "bg-emerald-500/15 text-emerald-400",
      },
      rose: {
        shadow: "hover:shadow-rose-500/20 hover:border-rose-500/50",
        badge:  "bg-rose-500/15 text-rose-400",
      },
      amber: {
        shadow: "hover:shadow-amber-500/20 hover:border-amber-500/50",
        badge:  "bg-amber-500/15 text-amber-400",
      },
      sky: {
        shadow: "hover:shadow-sky-500/20 hover:border-sky-500/50",
        badge:  "bg-sky-500/15 text-sky-400",
      },
      violet: {
        shadow: "hover:shadow-violet-500/20 hover:border-violet-500/50",
        badge:  "bg-violet-500/15 text-violet-400",
      },
    };

    function toggleFooter(btn) {
      const footer = btn.closest(".border-t").querySelector(".footer-body");
      const chevron = btn.querySelector(".chevron");
      footer.classList.toggle("open");
      chevron.classList.toggle("open");
    }

    function renderCard(project, lang = 'de') {
      const accent = accentClasses[project.accentColor] ?? accentClasses.indigo;
      const title = lang === 'en' ? (project.title_en ?? project.title) : project.title;
      const description = lang === 'en' ? project.description_en : project.description;
      const summary = lang === 'en' ? project.summary_en : project.summary;
      const conclusionLabel = i18n[lang].conclusion;

      const footerRows = project.footer
        .map(row => {
          const tags = row.tags
            .map(tag => `<span class="tech-tag">${tag}</span>`)
            .join("");
          return `
            <tr class="align-top">
              <td class="footer-label pr-4 pt-1 whitespace-nowrap">${row.label}</td>
              <td class="flex flex-wrap gap-1.5 pb-2">${tags}</td>
            </tr>`;
        })
        .join("");

      return `
        <div class="w-full sm:w-[calc(50%-12px)] lg:w-[calc(33.333%-16px)] dark:bg-slate-800 bg-white border dark:border-slate-700 border-slate-200 rounded-2xl overflow-hidden shadow-lg ${accent.shadow} transition-all duration-300 hover:-translate-y-1 flex flex-col">

          <!-- Image -->
          <div class="relative h-52 overflow-hidden dark:bg-slate-900 bg-slate-100">
            <img src="img/${project.image}" alt="${title}"
              class="w-full h-full object-cover hover:scale-110 transition-all duration-500" />
            <div class="absolute inset-x-0 bottom-0 h-1/2 bg-gradient-to-t dark:from-slate-800/100 from-white/100 to-transparent"></div>
          </div>

          <!-- Body -->
          <div class="p-5 flex flex-col flex-1">
            <div class="flex items-baseline justify-between gap-2 mb-2">
              <h2 class="text-xl font-bold dark:text-white text-slate-800">${title}</h2>
              ${project.date ? `<span class="text-xs dark:text-slate-500 text-slate-400">${project.date}</span>` : ''}
            </div>
            <p class="text-content">${description.replace(/\n\n/g, "<br><br>")}</p>
            <h2 class="text-sm font-bold dark:text-white text-slate-700 mt-4 mb-1">${conclusionLabel}</h2>
            <p class="text-content">${summary}</p>
          </div>

          <!-- Collapsible Footer -->
          <div class="border-t dark:border-slate-700 border-slate-200">
            <div class="flex items-center justify-between px-5 py-3">
              <button onclick="toggleFooter(this)" class="footer-action">
                <svg class="chevron open w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
                </svg>
              </button>
              <a href="${project.link}" target="_blank" rel="noopener noreferrer"
                class="footer-action font-semibold">
                EXPLORE
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" />
                </svg>
              </a>
            </div>
            <div class="footer-body open">
              <div>
                <div class="px-5 pb-5">
                  <table class="w-full border-collapse">
                    ${footerRows}
                  </table>
                </div>
              </div>
            </div>
          </div>

        </div>`;
    }

    switchLang('en');
  </script>

</body>
</html>
